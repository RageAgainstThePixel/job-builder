name: validate
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['*']
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        shell: bash
      - run: npm run tests
        shell: bash
      - name: Setup Jobs
        id: setup-jobs
        uses: ./ # RageAgainstThePixel/job-builder
        with:
          build-options: ./.github/workflows/build-options.json
          group-by: 'unity-version' # Optional, defaults to the first property in the build options object
          job-name-prefix: 'Build' # Optional, defaults to empty string
      - name: Verify Job Output was generated
        env:
          JOBS: ${{ steps.setup-jobs.outputs.jobs }}
        run: |
          output=$(echo "${JOBS}" | jq -r '. | length')
          if [ -z "$output" ] || [ "$output" -eq 0 ]; then
            echo "No jobs were generated. Please check your build options.";
            exit 1;
          fi
        shell: bash
    outputs:
      jobs: ${{ steps.setup-jobs.outputs.jobs }}
  validate:
    if: ${{ needs.setup.outputs.jobs }}
    needs: setup
    name: ${{ matrix.jobs.name }}
    secrets: inherit
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.setup.outputs.jobs) }}
      fail-fast: false
    uses: ./.github/workflows/build.yml
    with:
      matrix: ${{ toJSON(matrix.jobs.matrix) }}
